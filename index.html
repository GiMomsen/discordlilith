<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LILITH</title>

  <!-- FONTES -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- ICONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- LOADING -->
  <div id="loader">
    <h1>LILITH</h1>
  </div>

  <!-- FUNDO GIF -->
  <div class="bg-gif"></div>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- GRID -->
  <div class="grid"></div>

  <!-- PARTICULAS -->
  <div class="particles"></div>

  <!-- CHUVA -->
  <div class="rain"></div>

  <!-- MUSICA -->
  <audio id="music" loop>
    <source src="assets/music.mp3" type="audio/mp3">
  </audio>

  <!-- CARD -->
  <main class="card">

    <!-- STATUS -->
    <div class="online-status">
      <span></span>
      ONLINE
    </div>

    <!-- FOTO -->
    <img
      src="assets/profile.gif"
      alt="Lilith"
      class="avatar"
    >

    <!-- TITULO -->
    <h1>LILITH</h1>

    <!-- TYPING -->
    <p class="typing"></p>

    <!-- LINHA -->
    <div class="line"></div>

    <!-- STATS -->
    <div class="stats">

      <div>
        <h3 id="views">0</h3>
        <span>VIEWS</span>
      </div>

      <div>
        <h3>24/7</h3>
        <span>ONLINE</span>
      </div>

    </div>

    <!-- LINKS -->
    <div class="links">

      <a href="https://www.instagram.com/gi.olvs/" target="_blank">

        <i class="fab fa-instagram"></i>

        INSTAGRAM

      </a>

      <a href="https://www.tiktok.com/@gililithh" target="_blank">

        <i class="fab fa-tiktok"></i>

        TIKTOK

      </a>

      <a href="https://open.spotify.com/user/31ueoha6cik36seagfqlgpjokuja?si=8fa655dd8a5b4fc5" target="_blank">

        <i class="fab fa-spotify"></i>

        SPOTIFY

      </a>

      <a href="https://github.com/GiMomsen" target="_blank">

        <i class="fab fa-github"></i>

        GITHUB

      </a>

    </div>

    <!-- FOOTER -->
    <footer>
      DESIGNED BY LILITH
    </footer>

  </main>

  <!-- CURSOR -->
  <div class="cursor-glow"></div>

  <!-- JAVASCRIPT -->
  <script>

    /* ========================= */
    /* LOADER */
    /* ========================= */

    window.addEventListener("load", () => {

      setTimeout(() => {

        document.getElementById("loader").classList.add("hide");

      }, 1800);

    });

    /* ========================= */
    /* MUSICA */
    /* ========================= */

    const music = document.getElementById("music");

    document.addEventListener("click", () => {

      music.play();

    }, { once: true });

    /* ========================= */
    /* CURSOR */
    /* ========================= */

    const cursor = document.querySelector(".cursor-glow");

    document.addEventListener("mousemove", (e) => {

      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";

    });

    /* ========================= */
    /* TYPING */
    /* ========================= */

    const text = [

      "CYBER SECURITY",
      "DARK FEMME",
      "VALORANT PLAYER"

    ];

    let count = 0;
    let index = 0;
    let currentText = "";
    let letter = "";

    (function type(){

      if(count === text.length){

        count = 0;

      }

      currentText = text[count];

      letter = currentText.slice(0, ++index);

      document.querySelector(".typing").textContent = letter;

      if(letter.length === currentText.length){

        count++;
        index = 0;

        setTimeout(type, 1500);

      }else{

        setTimeout(type, 90);

      }

    })();

    /* ========================= */
    /* CONTADOR */
    /* ========================= */

    let views = localStorage.getItem("views") || 0;

    views++;

    localStorage.setItem("views", views);

    document.getElementById("views").innerText = views;

    /* ========================= */
    /* CHUVA */
    /* ========================= */

    const rain = document.querySelector(".rain");

    for(let i = 0; i < 80; i++){

      const drop = document.createElement("span");

      drop.style.left = Math.random() * window.innerWidth + "px";

      drop.style.animationDuration =
      0.5 + Math.random() + "s";

      drop.style.animationDelay =
      Math.random() * 5 + "s";

      rain.appendChild(drop);

    }

  </script>

</body>
</html>
